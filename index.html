<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Okul Ekmek Takip</title>
<meta name="description" content="Okul ekmek ihalesi sipariş, üretim ve veresiye takip sistemi">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#33473F">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Okul Ekmek">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2E9; --surface:#FFFFFF; --ink:#26302A; --ink-soft:#5B6459;
  --wheat:#C79A3D; --wheat-dark:#9C7726; --slate:#33473F; --slate-light:#4C6459;
  --line:#E3DCC9; --danger:#A6432F; --good:#3E7A52;
  --radius:10px; --font-size:16px;
  color-scheme: light;
}
body.dark{ color-scheme: dark; }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{overscroll-behavior-y:contain;}
body{
  font-family:'IBM Plex Sans',sans-serif; background:var(--bg); color:var(--ink);
  font-size:var(--font-size); -webkit-tap-highlight-color:transparent;
  min-height:100vh;
}
body.dark{
  --bg:#1B211C; --surface:#242B24; --ink:#EDE8DA; --ink-soft:#A9B2A3;
  --line:#37402F; --wheat:#D9AE55;
}
h1,h2,h3{font-family:'Bitter',serif; font-weight:600; color:var(--ink);}
.app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg);}
header.top{
  padding:20px 20px 16px; background:linear-gradient(135deg,var(--slate) 0%, var(--slate-light) 100%); color:#F6F2E9;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 8px 20px -12px rgba(38,48,42,.5);
}
header.top .brand{display:flex; align-items:center; gap:10px;}
header.top .logo{width:36px; height:36px; border-radius:9px; object-fit:contain; background:#F6F2E9; padding:4px; box-shadow:0 2px 8px rgba(0,0,0,.25);}
header.top h1{color:#F6F2E9; font-size:1.15rem;}
header.top .sub{font-size:.75rem; color:#C9D3C6; margin-top:2px;}
.iconbtn{background:rgba(255,255,255,.08); border:none; color:#F6F2E9; font-size:1rem; cursor:pointer; padding:7px 12px; border-radius:8px;}
main{flex:1; padding:16px 16px 90px;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(38,48,42,.05), 0 8px 20px -14px rgba(38,48,42,.18);
}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.school-row{padding:9px 0; border-bottom:1px solid var(--line);}
.school-row:last-child{border-bottom:none;}
.school-row .row > div:first-child{display:flex; align-items:baseline; gap:6px; min-width:0; flex:1; overflow:hidden;}
.school-name{font-weight:600; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:62%;}
.school-meta{font-size:.72rem; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.okul-line{display:flex; align-items:center; gap:8px;}
.okul-line .school-name{max-width:none; flex:1 1 auto; display:flex; align-items:center; gap:6px; overflow:hidden; min-width:0;}
.okul-line .name-txt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.okul-line .tag{flex-shrink:0;}
.mini-select{
  width:auto; max-width:108px; flex-shrink:0; margin-top:0; padding:7px 8px; font-size:.78rem;
  border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);
}
.qty-input{
  width:64px; text-align:center; padding:8px 4px; border:1px solid var(--line);
  border-radius:10px; font-size:.95rem; background:var(--bg); color:var(--ink);
  transition:border-color .15s;
}
.qty-input:focus{outline:none; border-color:var(--wheat);}
.tag{
  display:inline-block; font-size:.68rem; padding:2px 8px; border-radius:20px;
  background:rgba(199,154,61,.18); color:var(--wheat-dark); font-weight:600; margin-left:6px;
}
body.dark{ --tag-shadow: none; }
.tag{box-shadow:inset 0 0 0 1px rgba(199,154,61,.15);}
.tag.direct{background:rgba(62,122,82,.18); color:var(--good); box-shadow:inset 0 0 0 1px rgba(62,122,82,.15);}
button.primary{
  width:100%; padding:14px; background:linear-gradient(135deg,var(--slate),var(--slate-light));
  color:#F6F2E9; border:none; border-radius:12px; font-size:.95rem; font-weight:600; cursor:pointer;
  font-family:inherit; box-shadow:0 6px 16px -6px rgba(51,71,63,.5); transition:transform .1s, box-shadow .1s;
}
button.primary:active{transform:translateY(1px); box-shadow:0 3px 10px -6px rgba(51,71,63,.5);}
button.ghost{
  background:none; border:1px solid var(--line); color:var(--ink); padding:10px 14px;
  border-radius:12px; font-size:.88rem; cursor:pointer; font-family:inherit;
}
input,select{
  width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface); color:var(--ink); font-size:.92rem; font-family:inherit; margin-top:6px;
  -webkit-text-fill-color:var(--ink); caret-color:var(--ink); transition:border-color .15s;
}
input:focus,select:focus{outline:none; border-color:var(--wheat);}
label{font-size:.78rem; color:var(--ink-soft); font-weight:500;}
.field{margin-bottom:12px;}
nav.tabs{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:var(--surface); border-top:1px solid var(--line); display:flex;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 18px -14px rgba(38,48,42,.3);
}
nav.tabs button{
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
  gap:3px; padding:7px 2px; color:var(--ink-soft); font-size:.66rem; font-family:inherit; cursor:pointer;
  border-radius:10px; transition:background .15s, color .15s;
}
nav.tabs button.active{color:var(--wheat-dark); background:rgba(199,154,61,.12);}
body.dark nav.tabs button.active{color:var(--wheat);}
nav.tabs .ic{width:20px; height:20px; margin-bottom:1px;}
.totalbar{
  display:flex; justify-content:space-between; align-items:baseline; padding:16px 18px;
  background:linear-gradient(135deg,var(--slate),var(--slate-light)); color:#F6F2E9; border-radius:16px; margin-bottom:14px;
  box-shadow:0 10px 24px -14px rgba(51,71,63,.6);
}
.totalbar .num{font-family:'Bitter',serif; font-size:1.7rem; font-weight:700; color:var(--wheat);}
.firma-block{margin-bottom:18px;}
.firma-title{
  font-size:.8rem; font-weight:600; text-transform:none; color:var(--ink-soft);
  margin-bottom:6px; padding-left:2px;
}
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--slate);}
.login-card{background:var(--surface); border-radius:16px; padding:28px 24px; max-width:360px; width:100%;}
.login-card h1{text-align:center; margin-bottom:4px; font-size:1.3rem;}
.login-logo{display:block; width:120px; height:auto; margin:0 auto 6px;}
.login-card .sub{text-align:center; color:var(--ink-soft); font-size:.82rem; margin-bottom:20px;}
.msg-btn{
  display:flex; align-items:center; justify-content:center; gap:8px; padding:11px;
  border-radius:8px; font-size:.85rem; font-weight:600; text-decoration:none; cursor:pointer; border:none; font-family:inherit;
}
.msg-btn.wa{background:#25D366; color:#fff;}
.msg-btn.tg{background:#2AABEE; color:#fff;}
.empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
.led{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle; background:#9AA79A;}
.led.live{background:#3DDC84; box-shadow:0 0 6px #3DDC84, 0 0 12px rgba(61,220,132,.5);}
.led.error{background:#E5533D; box-shadow:0 0 6px #E5533D;}
.led.connecting{background:#E3C05A; animation:ledPulse 1.2s ease-in-out infinite;}
@keyframes ledPulse{0%,100%{opacity:.35}50%{opacity:1}}
.verbar{text-align:center; padding:14px 16px 6px; font-size:.7rem; color:var(--ink-soft);}
.linkbox{
  background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:10px 12px;
  font-size:.8rem; color:var(--ink-soft); word-break:break-all; margin-top:8px;
}
.settings-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
.settings-row:last-child{border-bottom:none;}
.toggle{width:42px; height:24px; border-radius:20px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0;}
.toggle.on{background:var(--wheat);}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;}
.toggle.on::after{left:20px;}
.fs-group{display:flex; gap:6px;}
.fs-group button{padding:7px 12px; border:1px solid var(--line); background:var(--surface); border-radius:8px; color:var(--ink); font-family:inherit; cursor:pointer;}
.fs-group button.active{background:var(--wheat); color:#fff; border-color:var(--wheat);}
.badge-role{font-size:.68rem; color:var(--ink-soft); background:var(--bg); padding:3px 8px; border-radius:12px;}
</style>
</head>

function migrate(raw){
  const defaults = defaultDB();
  const merged = Object.assign({}, defaults, raw || {});
  for(const k in defaults){ if(merged[k] === undefined) merged[k] = defaults[k]; }
  merged.schools = (merged.schools || []).map(s=>{
    if(!s.productId){ s.productId = s.product === 'Roll Ekmek' ? 'roll' : 'ekmek'; }
    delete s.product;
    return s;
  });
  merged.personel = (merged.personel || []).map(p=>{
    if(!p.perms) p.perms = {};
    return p;
  });
  // give older payment records a stable id so deleting one is unambiguous
  Object.keys(merged.payments || {}).forEach(k=>{
    merged.payments[k] = (merged.payments[k]||[]).map((entry,i)=>{
      if(!entry.id) entry.id = 'pay_' + k + '_' + i + '_' + (entry.date||'');
      return entry;
    });
  });
  return merged;
}
let db = null;
let dbReady = false;
let pendingWrites = 0;
let hasUnsavedEdits = false;   // set while a form has typed-but-unsaved values

// Device-local preferences (dark mode, font size) are NOT shared between
// devices - they live in localStorage only, so one phone's display settings
// can never overwrite another's data.
const PREFS_KEY = 'okulEkmekPrefs';
function loadPrefs(){
  try{ return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; }catch(e){ return {}; }
}
function savePrefs(p){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }catch(e){}
}
let prefs = Object.assign({fontSize:'medium', dark:false}, loadPrefs());

// Every change goes through a transaction: read the newest server copy,
// apply ONLY this change on top of it, write back. This is what stops two
// devices from wiping each other's work.
async function mutate(applyChange){
  if(applyChange(db) === false) return;  // apply locally for instant feedback
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(db)); }catch(e){}
  if(dbReady) render();

  pendingWrites++;
  try{
    await runTransaction(firestore, async (tx)=>{
      const snap = await tx.get(STATE_DOC);
      const current = (snap.exists() && snap.data().json)
        ? migrate(JSON.parse(snap.data().json))
        : defaultDB();
      applyChange(current);
      tx.set(STATE_DOC, { json: JSON.stringify(current) });
    });
  }catch(e){
    console.error('Kaydedilemedi', e);
    alert('Değişiklik kaydedilemedi, internet bağlantını kontrol edip tekrar dene.');
  }finally{
    pendingWrites--;
  }
}
let syncState = 'connecting';   // connecting | live | error
function setSync(state){
  syncState = state;
  const el = document.getElementById('syncDot');
  if(el){
    const label = state==='live' ? 'Bağlı' : state==='error' ? 'Bağlantı yok' : 'Bağlanıyor';
    el.innerHTML = `<span class="led ${state}"></span>${label}`;
  }
}
async function bootStorage(){
  // show cached data instantly (if any) while we connect
  try{
    const cached = localStorage.getItem(LOCAL_CACHE_KEY);
    if(cached){ db = migrate(JSON.parse(cached)); dbReady = true; render(); }
  }catch(e){}

  // IMPORTANT: sign in FIRST. Firestore rules require auth, and subscribing
  // before sign-in completes gets rejected, which silently kills live sync.
  try{
    await signInAnonymously(fbAuth);
  }catch(e){
    console.error('Auth failed', e);
    setSync('error');
    if(!db){ db = defaultDB(); dbReady = true; render(); }
    alert('Firebase girişi başarısız. Firebase Console > Authentication > Sign-in method bölümünden "Anonymous" açık mı kontrol et.');
    return;
  }

  onSnapshot(STATE_DOC, snap=>{
    setSync('live');
    if(snap.exists() && snap.data().json){
      db = migrate(JSON.parse(snap.data().json));
      try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(db)); }catch(e){}
      dbReady = true;
      // don't yank the screen out from under someone mid-edit
      const active = document.activeElement;
      const typing = active && (active.tagName === 'INPUT' || active.tagName === 'SELECT');
      // never redraw over edits the user hasn't saved yet
      if(!typing && pendingWrites === 0 && !hasUnsavedEdits) render();
    } else if(!snap.exists() && !snap.metadata.fromCache && !snap.metadata.hasPendingWrites){
      // Genuine first run ONLY. We must be certain this "empty" answer came from
      // the server and not from a momentary offline/cache read - otherwise we
      // would overwrite real data with the blank starter set. That was the bug
      // that kept zeroing the quantities.
      if(!db) db = defaultDB();
      dbReady = true;
      setDoc(STATE_DOC, { json: JSON.stringify(db) }).catch(e=>console.error(e));
      render();
    }
  }, err=>{
    console.error('Firestore sync error', err);
    setSync('error');
    if(!db){ db = defaultDB(); dbReady = true; render(); }
    alert('Canlı bağlantı kurulamadı: ' + err.code + '\nFirestore kurallarını kontrol et.');
  });
}

function tomorrowStr(){
  const d = new Date(); d.setDate(d.getDate()+1);
  return d.toISOString().slice(0,10);
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function fmtDate(s){
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('tr-TR',{day:'2-digit',month:'long',weekday:'long'});
}
function getOrderQty(dateStr, school){
  const o = db.orders[dateStr];
  if(o && o[school.id] !== undefined) return o[school.id];
  return school.qty;
}
function setOrderQty(dateStr, schoolId, qty){
  mutate(d=>{
    if(!d.orders[dateStr]) d.orders[dateStr] = {};
    d.orders[dateStr][schoolId] = qty;
  });
}
function ensureOrderDate(dateStr){
  // when a date is first opened for entry, lock in every school's default qty
  // so ekstre/statement totals reflect what was actually confirmed, not guesses
  if(db.orders[dateStr]) return;
  mutate(d=>{
    if(d.orders[dateStr]) return false;   // another device already created it
    const entry = {};
    d.schools.forEach(s=>{ entry[s.id] = s.qty; });
    d.orders[dateStr] = entry;
  });
}
function monthTotal(schoolId){
  // sum actual order entries this calendar month for this school (no fake/demo extrapolation)
  let total = 0;
  const now = new Date(); const ym = now.toISOString().slice(0,7);
  for(const date in db.orders){
    if(date.slice(0,7) === ym && db.orders[date][schoolId] !== undefined){
      total += db.orders[date][schoolId];
    }
  }
  return total;
}
function paid(schoolKey){
  const log = db.payments[schoolKey] || [];
  return log.reduce((a,p)=>a+p.amount,0);
}
function addPayment(key, amount, note){
  const entry = {date: todayStr(), amount, note: note||'', id: Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
  mutate(d=>{
    if(!d.payments[key]) d.payments[key] = [];
    if(d.payments[key].some(p=>p.id===entry.id)) return false;
    d.payments[key].push(Object.assign({}, entry));
  });
}
function removePayment(key, paymentId){
  mutate(d=>{
    if(!d.payments[key]) return false;
    d.payments[key] = d.payments[key].filter(p=>p.id !== paymentId);
  });
}
function product(school){ return db.products.find(p=>p.id===school.productId) || db.products[0]; }
function tl(n){ return n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ₺'; }
function monthMoney(schoolId){
  const s = db.schools.find(x=>x.id===schoolId);
  return monthTotal(schoolId) * product(s).price;
}

// ---------- session ----------
let session = null; // {role, key, tab}

const SESSION_KEY = 'okulEkmekSession';
function saveSession(s){
  try{
    if(s) localStorage.setItem(SESSION_KEY, JSON.stringify({role:s.role, key:s.key}));
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}
function defaultTabFor(role){
  return role==='admin' ? 'siparis' : role==='personel' ? 'uretim' : 'ekstre';
}
// Re-check the saved login against current data: if the password changed or the
// account was deleted on another device, the stored session must not let them in.
function restoreSession(){
  if(session || !db) return;
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return; }
  if(!saved || !saved.role) return;
  const ok =
    saved.role==='admin'    ? true :
    saved.role==='personel' ? db.personel.some(p=>p.username===saved.key) :
    saved.role==='firma'    ? !!db.firmalar[saved.key] :
    saved.role==='school'   ? db.schools.some(s=>s.id===saved.key && s.portal) : false;
  if(!ok){ saveSession(null); return; }
  session = {role: saved.role, key: saved.key, tab: defaultTabFor(saved.role)};
}

      }

      edits[id].productId = sel.value;
    });
    mutate(d=>{
      d.schools.forEach(s=>{
        const e = edits[s.id];
        if(!e) return;
        if(e.qty !== undefined) s.qty = e.qty;

// ---- Mesaj (admin: whatsapp / telegram send) ----
function buildOrderMessage(){
  const date = tomorrowStr();
  const byProduct = {};
  db.schools.forEach(s=>{
    const p = product(s);
    const qty = getOrderQty(date, s);
    if(!byProduct[p.id]) byProduct[p.id] = {name:p.name, qty:0, money:0};
    byProduct[p.id].qty += qty;
    byProduct[p.id].money += qty * p.price;
  });
  const productLines = Object.values(byProduct).map(p=>`${p.name}: ${p.qty} adet — ${tl(p.money)}`).join('\n');
  const schoolLines = db.schools.map(s=>`${s.name}: ${getOrderQty(date,s)} adet (${product(s).name})`).join('\n');
  return `Okul Ekmek Siparişi — ${fmtDate(date)}\n\n${schoolLines}\n\nÜrün bazında toplam:\n${productLines}`;
}
function tabMesaj(){
  const text = buildOrderMessage();
  const tgReady = db.telegram && db.telegram.token && db.telegram.chatId;
  return `
  <div class="card">
    <h2 style="font-size:1rem;margin-bottom:8px;">Yarının sipariş özeti</h2>
    <div class="school-meta" style="white-space:pre-line;line-height:1.6;">${text}</div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px;">
    <button class="msg-btn wa" id="waBtn">📲 WhatsApp'tan gönder</button>
    <button class="msg-btn tg" id="tgBtn" ${tgReady?'':'disabled style="opacity:.5;"'}>✈️ Telegram'a gönder</button>
    ${tgReady ? '' : `<div class="school-meta">Telegram göndermek için Ayarlar sekmesinden bot token ve chat ID gir.</div>`}
  </div>
  <div class="card">
    <div class="school-meta">Ustalar "Personel" girişiyle kullanıcı adı/şifresiyle giriş yapıp yarının üretim listesini görebilir. Personel eklemek/silmek için Ayarlar sekmesine bak.</div>
  </div>`;
}
function attachTabMesaj(){
  const wa = document.getElementById('waBtn');
  if(wa) wa.onclick = ()=>{
    const text = buildOrderMessage();
    const waLink = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.location.href = waLink;
  };
  const tg = document.getElementById('tgBtn');
  if(tg) tg.onclick = async ()=>{
    if(!db.telegram || !db.telegram.token || !db.telegram.chatId) return;
    const text = buildOrderMessage();
    tg.disabled = true; tg.textContent = 'Gönderiliyor...';
    try{
      const url = `https://api.telegram.org/bot${db.telegram.token}/sendMessage?chat_id=${encodeURIComponent(db.telegram.chatId)}&text=${encodeURIComponent(text)}`;
      const res = await fetch(url);

      if(data.ok){ alert('Telegram\'a gönderildi.'); }
      else { alert('Gönderilemedi: ' + (data.description || 'bilinmeyen hata')); }
    }catch(e){
      alert('Gönderilemedi: bağlantı hatası. Bot token/chat ID doğru mu kontrol et.');

    tg.disabled = false; tg.textContent = "✈️ Telegram'a gönder";

      const inp = document.querySelector(`[data-firmapw="${f}"]`);
      const val = inp.value.trim();
      if(!val){ alert('Yeni şifre girin.'); return; }
      mutate(d=>{ if(!d.firmalar[f]) return false; d.firmalar[f].password = val; });
      alert(f+' şifresi güncellendi.');
    };
  });
  document.querySelectorAll('[data-saveschoolpw]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.saveschoolpw;
      const inp = document.querySelector(`[data-schoolpw="${id}"]`);
      const val = inp.value.trim();
      if(!val){ alert('Yeni şifre girin.'); return; }
      const s = db.schools.find(x=>x.id===id);
      mutate(d=>{ const t = d.schools.find(x=>x.id===id); if(!t) return false; t.portal = val; });
      alert(s.name+' şifresi güncellendi.');
    };
  });
  document.querySelectorAll('[data-permuser]').forEach(cb=>{
    cb.onchange = ()=>{
      const uname = cb.dataset.permuser, key = cb.dataset.permkey, on = cb.checked;
      mutate(d=>{
        const p = d.personel.find(x=>x.username===uname); if(!p) return false;
        if(!p.perms) p.perms = {};
        p.perms[key] = on;
      });
    };
  });
  document.querySelectorAll('[data-delpers]').forEach(btn=>{
    btn.onclick = ()=>{
      if(db.personel.length<=1){ alert('En az bir personel kalmalı.'); return; }
      const uname = btn.dataset.delpers;
      mutate(d=>{ d.personel = d.personel.filter(p=>p.username!==uname); });
    };
  });
  const addPersBtn = document.getElementById('addPersBtn');
  if(addPersBtn) addPersBtn.onclick = ()=>{
    const name = document.getElementById('newPersName').value.trim();
    const uname = document.getElementById('newPersUser').value.trim();
    const pw = document.getElementById('newPersPw').value.trim();
    if(!name || !uname || !pw){ alert('Tüm alanları doldurun.'); return; }
    if(db.personel.some(p=>p.username===uname)){ alert('Bu kullanıcı adı zaten var.'); return; }
    const rec = {username:uname, password:pw, name, perms:{}};
    mutate(d=>{ if(d.personel.some(p=>p.username===uname)) return false; d.personel.push(Object.assign({}, rec)); });
  };
}

function attachTab(){
  attachTabSiparis(); attachTabOkullar(); attachTabUrunler(); attachTabFirmalar(); attachTabMesaj(); attachTabAyarlar();
}

render();
bootStorage();

// PWA: telefona kurulabilsin ve internet kesilse bile açılabilsin diye
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW kaydedilemedi', e));
  });
}
